<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>倒數計時：11/4</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f9e5e5, #d2f5ff, #ffe8a3);
      --text-color: #3c3c3c;
      --pink: #ff7aa2;
      --mint: #74d3ae;
      --white: #ffffff;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "Segoe UI", "微軟正黑體", sans-serif;
      background: var(--bg-gradient);
      overflow: hidden;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      flex-direction: column;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
      animation: fadeIn 1.5s ease-in;
    }

    h1 {
		font-size: clamp(2rem, 5vw, 4rem);
		color: #FFB347; /* 橘黃色 */
		margin-bottom: 1.5rem;
		text-shadow: 2px 2px #ffffff88;
	}


    .count-row {
      font-size: clamp(1.5rem, 4vw, 3rem);
      font-weight: bold;
      margin: 1rem 0;
      padding: 1rem 2rem;
      border-radius: 25px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      transition: all 0.3s ease-in-out;
    }

    #countdown1 {
      background: var(--pink);
      color: var(--white);
    }

    #countdown2 {
      background: var(--mint);
      color: var(--white);
    }

    .count-row:hover {
      filter: brightness(1.1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
	.menu {
  margin-top: 3rem;
  display: flex;
  gap: 1.2rem;
  flex-wrap: wrap;
  justify-content: center;
  animation: fadeInUp 1s ease-out;
}

.menu-item {
  background: #fff6f6;
  color: #e85575;
  border-radius: 20px;
  padding: 0.8rem 1.4rem;
  font-size: clamp(1rem, 2.5vw, 1.5rem);
  box-shadow: 2px 4px 10px rgba(0, 0, 0, 0.08);
  transition: transform 0.2s ease, background 0.3s ease;
  cursor: pointer;
}

.menu-item:hover {
  transform: scale(1.08);
  background: #ffe3eb;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

  </style>
</head>
<body>
  <div class="container">
    <h1>距離 2025 年 11 月 4 日</h1>
    <div class="count-row" id="countdown1">載入中...</div>
    <div class="count-row" id="countdown2">載入中...</div>
  </div>

  <script>
    const targetDate = new Date("2025-11-04T00:00:00+08:00");

    function updateCountdown() {
      const now = new Date();
      let diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById("countdown1").textContent = "已到達 11/4！";
        document.getElementById("countdown2").textContent = "";
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / (60 * 60 * 24));
      const hours = Math.floor((totalSeconds / 3600) % 24);
      const minutes = Math.floor((totalSeconds / 60) % 60);
      const seconds = totalSeconds % 60;

      document.getElementById("countdown1").textContent =
        `${days} 天 ${hours} 小時 ${minutes} 分 ${seconds} 秒`;

      const nowDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const targetDateOnly = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());

      let years = targetDateOnly.getFullYear() - nowDate.getFullYear();
      let months = targetDateOnly.getMonth() - nowDate.getMonth();
      let daysRemain = targetDateOnly.getDate() - nowDate.getDate();

      if (daysRemain < 0) {
        months -= 1;
        const prevMonth = new Date(targetDateOnly.getFullYear(), targetDateOnly.getMonth(), 0);
        daysRemain += prevMonth.getDate();
      }

      if (months < 0) {
        years -= 1;
        months += 12;
      }

      const totalMonths = years * 12 + months;

      document.getElementById("countdown2").textContent =
        `${totalMonths} 個月 ${daysRemain} 天 ${hours} 小時 ${minutes} 分 ${seconds} 秒`;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>  
</div>

  <div class="menu">
  <div class="menu-item">咖哩</div>
  <div class="menu-item">水餃</div>
  <div class="menu-item">雞湯</div>
  <div class="menu-item">黑胡椒麵條</div>

</body>
</html>
