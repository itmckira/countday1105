<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>倒數 2026/10/22</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #FFF3E0, #E0F7FA);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 2rem;
      color: #333;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: #ff5fa2; /* 多巴胺粉 */
    }

    #countdown {
      font-size: 2.5rem;
      font-weight: bold;
      color: #3cb371; /* 多巴胺綠 */
      margin-bottom: 2rem;
    }

    ul {
      list-style-type: none;
      padding: 0;
      max-width: 500px;
      width: 100%;
    }

    li {
      background-color: #fff;
      margin-bottom: 1rem;
      padding: 1rem;
      border-left: 10px solid #4fc3f7; /* 多巴胺藍 */
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    li:nth-child(odd) {
      border-left-color: #f48fb1; /* 多巴胺粉 */
    }

    .date {
      font-weight: bold;
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      color: #ff9800; /* 多巴胺橘 */
    }

    .activities {
      margin-left: 1rem;
      color: #555;
    }

    @media screen and (max-width: 600px) {
      h1 { font-size: 2rem; }
      #countdown { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <h1>倒數 26/10/22</h1>
  <div id="countdown">Loading...</div>

  <ul>
    <li>
      <div class="date">10/22–10/25</div>
      <div class="activities">在燦燦家</div>
    </li>
    <li>
      <div class="date">10/26</div>
      <div class="activities">溫州入住<br>晚上印象南塘</div>
    </li>
    <li>
      <div class="date">10/27</div>
      <div class="activities">溫州走走逛逛<br>梧田老街</div>
    </li>
    <li>
      <div class="date">10/28</div>
      <div class="activities">燒肉午餐<br>歸途／彌彌回家</div>
    </li>
  </ul>

  <script>
    const countdownElement = document.getElementById('countdown');
    const targetDate = new Date("2026-10-22T00:00:00+08:00");

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        countdownElement.textContent = "🎉 今天就是 10/22/2026！";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      countdownElement.textContent = `還有 ${days} 天`;
    }

    updateCountdown();
    setInterval(updateCountdown, 60 * 1000);
  </script>

</body>
</html>
